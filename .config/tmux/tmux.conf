unbind r
bind r source-file ~/.config/tmux/tmux.conf

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'rose-pine/tmux'

if-shell '[ -f /home/lukas/.config/alacritty/themes/default.toml ]' \
    'set -g @rose_pine_variant "dawn"' 'set -g @rose_pine_variant "main"' 

set -g @rose_pine_directory 'on'
set -g @rose_pine_window_status_separator "  "

run '~/.tmux/plugins/tpm/tpm'

#set -g @rose_pine_default_window_behavior 'on'
#set -g @rose_pine_right_separator ''
#set -g @rose_pine_show_current_program 'off' 

set -s escape-time 0

set -g prefix C-Space
set -g mouse off
set -g base-index 1
set -g default-terminal "$TERM"
set -ga terminal-overrides ",$TERM:Tc"
#set -ga terminal-features ",alacritty:usstyle"
#set -ga terminal-features ",alacritty:RGB"
set -g set-titles on
set -g set-titles-string "#W"

set -g default-terminal 'screen-256color'
# undercurl support
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
# support colors for undercurl
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'


bind-key t set status

set-window-option -g mode-keys vi
set-option -g set-clipboard on
bind-key -n M-w copy-mode
bind-key -T copy-mode-vi C-u send-keys -X halfpage-up \; send-keys -X scroll-middle
bind-key -T copy-mode-vi C-d send-keys -X halfpage-down \; send-keys -X scroll-middle
bind-key -T copy-mode-vi Up send-keys -X scroll-up
bind-key -T copy-mode-vi Down send-keys -X scroll-down

set-option -g focus-events on
set-option -g status-interval 1
set-option -g renumber-windows on

unbind d
bind d set destroy-unattached off
set-option -g destroy-unattached on
set-option -g exit-empty off

bind -n M-c new-window -c "#{pane_current_path}"
bind -n M-v split-window -h -c "#{pane_current_path}" \; setenv WINDOW_SPLIT "h"
bind -n M-f split-window -v -c "#{pane_current_path}" \; setenv WINDOW_SPLIT "v"
bind -n M-x kill-pane
bind -n M-: command-prompt

bind -n M-p previous-window
bind -n M-n next-window

bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

bind -n M-d run-shell "/bin/bash /home/lukas/bin/switch-pane"

bind -n M-! join-pane -h -t 1
bind -n M-@ join-pane -h -t 2
bind -n M-# join-pane -h -t 3
bind -n M-$ join-pane -h -t 4
bind -n M-% join-pane -h -t 5
bind -n M-^ join-pane -h -t 6
bind -n M-& join-pane -h -t 7
bind -n M-* join-pane -h -t 8
bind -n M-( join-pane -h -t 9

bind-key q kill-session

